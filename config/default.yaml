# OpenTrade Default Configuration
# ================================
# DISCLAIMER: Trading cryptocurrency involves substantial risk of loss.
# This configuration is for paper trading / testing only.
# No profitability is guaranteed.

mode: paper

exchange:
  name: binance
  use_testnet: true
  api_key_env: BINANCE_API_KEY
  api_secret_env: BINANCE_API_SECRET
  rate_limit_per_minute: 1200
  recv_window_ms: 5000
  timeout_secs: 30
  ws_reconnect_delay_ms: 1000
  ws_max_reconnect_attempts: 10

symbols:
  - symbol: BTCUSDT
    market_type: spot
    timeframes: ["1h", "4h"]
    enabled: true
  - symbol: ETHUSDT
    market_type: spot
    timeframes: ["1h"]
    enabled: true

strategies:
  - name: trend_btc
    strategy_type: trend_following
    enabled: true
    symbols: ["BTCUSDT"]
    timeframe: "1h"
    params:
      fast_period: 20
      slow_period: 50
      rsi_overbought: "70"
      rsi_oversold: "30"
      atr_stop_multiplier: "2"
      atr_target_multiplier: "3"
      cooldown: 5
      allow_short: false
    capital_allocation_pct: "0.4"

  - name: mean_rev_eth
    strategy_type: mean_reversion
    enabled: true
    symbols: ["ETHUSDT"]
    timeframe: "1h"
    params:
      rsi_overbought: "75"
      rsi_oversold: "25"
      atr_stop_multiplier: "1.5"
      cooldown: 3
      allow_short: false
    capital_allocation_pct: "0.3"

  - name: breakout_btc
    strategy_type: breakout
    enabled: true
    symbols: ["BTCUSDT"]
    timeframe: "4h"
    params:
      lookback: 20
      volume_multiplier: "1.5"
      atr_stop_multiplier: "2"
      atr_target_multiplier: "3"
      cooldown: 5
      allow_short: false
    capital_allocation_pct: "0.3"

  # --- Advanced AI-driven strategies ---
  - name: funding_rate_btc
    strategy_type: funding_rate
    enabled: false
    symbols: ["BTCUSDT"]
    timeframe: "1h"
    params:
      entry_threshold: "0.0005"
      extreme_threshold: "0.001"
      rsi_confirm_min: "30"
      rsi_confirm_max: "70"
      atr_stop_multiplier: "2"
      atr_target_multiplier: "2.5"
      max_hold_bars: 24
      cooldown: 8
    capital_allocation_pct: "0.15"

  - name: imbalance_btc
    strategy_type: imbalance
    enabled: false
    symbols: ["BTCUSDT"]
    timeframe: "1m"
    params:
      min_imbalance: "0.2"
      persistence_bars: 3
      volume_confirm: "1.2"
      atr_stop_multiplier: "1.5"
      atr_target_multiplier: "2"
      cooldown: 3
    capital_allocation_pct: "0.1"

  - name: regime_transition_btc
    strategy_type: regime_transition
    enabled: false
    symbols: ["BTCUSDT"]
    timeframe: "4h"
    params:
      stability_threshold: "0.5"
      stability_lookback: 10
      min_emerging_trend: "0.8"
      atr_stop_multiplier: "2.5"
      atr_target_multiplier: "3.5"
      cooldown: 8
    capital_allocation_pct: "0.15"

  - name: cross_tf_btc
    strategy_type: cross_timeframe
    enabled: false
    symbols: ["BTCUSDT"]
    timeframe: "15m"
    params:
      min_disagreement: "15"
      atr_stop_multiplier: "2"
      atr_target_multiplier: "3"
      cooldown: 5
    capital_allocation_pct: "0.1"

  - name: anti_consensus
    strategy_type: anti_consensus
    enabled: false
    symbols: ["BTCUSDT"]
    timeframe: "1h"
    params:
      min_consensus_count: 3
      dampening_factor: "0.3"
      generate_contrarian: true
      atr_stop_multiplier: "1.5"
      atr_target_multiplier: "2"
      cooldown: 10
    capital_allocation_pct: "0.1"

  - name: risk_signal_btc
    strategy_type: risk_signal
    enabled: false
    symbols: ["BTCUSDT"]
    timeframe: "1h"
    params:
      vol_spike_threshold: "2"
      risk_event_threshold: 2
      risk_event_lookback: 5
      atr_stop_multiplier: "1.5"
      atr_target_multiplier: "2.5"
      cooldown: 5
    capital_allocation_pct: "0.1"

risk:
  max_position_size_usd: "100000"
  max_leverage: "3"
  max_daily_loss_pct: "2"
  max_drawdown_pct: "10"
  max_open_positions: 5
  max_notional_exposure_usd: "500000"
  max_single_order_usd: "50000"
  max_trades_per_day: 100
  max_correlated_exposure_pct: "40"
  stale_data_max_age_secs: 30
  max_spread_bps: "50"
  min_confidence_threshold: "0.6"
  extreme_volatility_multiplier: "3"
  max_order_rejections_per_hour: 5
  max_orders_per_minute: 30

portfolio:
  initial_capital: "100000"
  risk_per_trade_pct: "0.5"
  target_volatility_pct: "15"
  kelly_fraction: "0.25"
  max_portfolio_leverage: "2"
  concentration_limit_pct: "25"
  correlation_lookback_bars: 100
  rebalance_threshold_pct: "5"

execution:
  default_order_type: limit
  slippage_bps: "5"
  max_retries: 3
  retry_delay_ms: 500
  cancel_timeout_secs: 10
  reconciliation_interval_secs: 60
  smart_order_splitting: false
  max_split_orders: 5
  min_order_size_usd: "10"

backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  fee_rate_bps: "10"
  slippage_bps: "5"
  initial_capital: "100000"
  enable_partial_fills: false
  latency_ms: 50
  use_funding_fees: false

storage:
  database_path: "./data/opentrade.db"
  data_dir: "./data"
  journal_enabled: true
  max_candle_cache_size: 100000

telemetry:
  log_level: info
  json_logs: false
  metrics_enabled: true
  metrics_port: 9090
  tracing_enabled: true

features:
  enable_ml_models: false
  enable_market_making: false
  enable_statistical_arbitrage: false
  enable_smart_order_routing: false
  enable_monte_carlo_stress: true
  enable_neural_brain: false
  enable_collective_thinking: false

# Neural AI Brain Configuration
# Requires Ollama running locally (or on network)
# Model: Qwen3.5-9B-Claude-4.6-Opus-Reasoning-Distilled-GGUF
# Setup: ollama create qwen-trading -f Modelfile
neural_brain:
  enabled: false
  ollama_servers:
    - name: local-ollama
      base_url: "http://localhost:11434"
      weight: 1
      models: ["qwen-trading:latest"]
      enabled: true
    # Add more servers for collective thinking:
    # - name: gpu-server
    #   base_url: "http://192.168.1.100:11434"
    #   weight: 2
    #   models: ["qwen-trading:latest"]
    #   enabled: true
  default_model: "qwen-trading:latest"
  classify_model: null
  reasoning_model: null
  temperature: 0.3
  timeout_secs: 30
  collective_thinking: false
  consensus_threshold: 0.6
  memory_db_path: "./data/neural_memory.db"
  personality: balanced    # balanced, conservative, aggressive, scalper
  analysis_interval: 5     # deep analysis every N candles
